<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI商业模式海报</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 512px;
        height: 1280px;
        margin: 0;
        overflow: hidden;
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        background: #07111d;
      }

      .poster {
        position: relative;
        width: 512px;
        height: 1280px;
        overflow: hidden;
        color: #fff7e5;
        background: #07111d;
      }

      .bg {
        position: absolute;
        inset: -34px;
        width: calc(100% + 68px);
        height: calc(100% + 68px);
        object-fit: cover;
        filter: blur(14px) saturate(0.82) contrast(0.92);
        opacity: 0.48;
      }

      .poster::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 76% 34%, rgba(214, 160, 78, 0.24), transparent 210px),
          radial-gradient(circle at 28% 74%, rgba(214, 160, 78, 0.18), transparent 260px),
          linear-gradient(180deg, rgba(5, 11, 20, 0.98), rgba(5, 11, 20, 0.44) 42%, rgba(5, 11, 20, 0.98)),
          linear-gradient(90deg, rgba(5, 11, 20, 0.94), rgba(5, 11, 20, 0.42) 58%, rgba(5, 11, 20, 0.8));
      }

      .poster::after {
        content: "";
        position: absolute;
        inset: 20px;
        border: 1px solid rgba(246, 210, 141, 0.28);
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 48px 38px 36px;
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 30px;
        color: #f1c979;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 2px;
      }

      .kicker::before,
      .kicker::after {
        content: "";
        height: 1px;
        flex: 1;
        background: rgba(241, 201, 121, 0.55);
      }

      .title-main {
        margin: 0 0 12px;
        font-size: 78px;
        line-height: 0.98;
        font-weight: 900;
        letter-spacing: 0;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
      }

      .title-main .gold {
        display: block;
        color: #f3d28a;
      }

      .ai-title {
        margin: 24px 0 8px;
        font-size: 72px;
        line-height: 0.92;
        font-weight: 900;
      }

      .ai-title span {
        display: block;
        color: #f3d28a;
      }

      .subtitle {
        margin: 0;
        padding: 12px 16px;
        width: fit-content;
        border: 1px solid rgba(243, 210, 138, 0.58);
        color: #fff7e5;
        background: rgba(5, 11, 20, 0.54);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .info {
        margin-top: auto;
        display: grid;
        gap: 14px;
      }

      .speaker {
        width: 72%;
        padding: 18px 18px 20px;
        background: rgba(5, 11, 20, 0.82);
        border-left: 5px solid #f3d28a;
        backdrop-filter: blur(8px);
      }

      .speaker b {
        display: block;
        margin-bottom: 6px;
        color: #f3d28a;
        font-size: 30px;
        line-height: 1.1;
      }

      .speaker span {
        display: block;
        color: rgba(255, 247, 229, 0.82);
        font-size: 17px;
        line-height: 1.5;
      }

      .details {
        display: grid;
        gap: 10px;
        padding: 18px;
        background: rgba(5, 11, 20, 0.86);
        border: 1px solid rgba(243, 210, 138, 0.28);
      }

      .detail {
        display: grid;
        grid-template-columns: 86px 1fr;
        gap: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 247, 229, 0.14);
        font-size: 18px;
        line-height: 1.45;
      }

      .detail:last-child {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .detail b {
        color: #f3d28a;
      }

      .footer-line {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid rgba(243, 210, 138, 0.28);
        border-bottom: 1px solid rgba(243, 210, 138, 0.28);
      }

      .footer-line span {
        min-height: 82px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        text-align: center;
        color: #f3d28a;
        font-size: 16px;
        font-weight: 800;
        line-height: 1.35;
        border-right: 1px solid rgba(243, 210, 138, 0.28);
      }

      .footer-line span:last-child {
        border-right: 0;
      }
    </style>
  </head>
  <body>
    <div class="poster">
      <img class="bg" src="img/ai-growth-poster.jpeg" alt="" aria-hidden="true" />
      <div class="content">
        <div class="kicker">未来已来 · 你准备好了吗？</div>

        <h1 class="title-main">
          冲出重围
          <span class="gold">5.0</span>
        </h1>

        <h2 class="ai-title">
          AI商业
          <span>模式</span>
        </h2>

        <p class="subtitle">引领未来增长</p>

        <div class="info">
          <div class="speaker">
            <b>王冲老师</b>
            <span>商业战略导师<br />AI商业模式架构师</span>
          </div>

          <div class="details">
            <div class="detail"><b>课程</b><span>3天2夜企业增长实战营</span></div>
            <div class="detail"><b>地点</b><span>马来西亚 · 吉隆坡</span></div>
            <div class="detail"><b>时间</b><span>2026年8月（待公布）</span></div>
            <div class="detail"><b>重点</b><span>商业模式 × 流量增长 × AI数智化落地</span></div>
          </div>

          <div class="footer-line">
            <span>AI驱动<br />智能决策</span>
            <span>商业创新<br />突破传统</span>
            <span>系统思维<br />降本增效</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
