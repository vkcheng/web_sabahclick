<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>冲出重围5.0 主视觉</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 720px;
        height: 760px;
        margin: 0;
        overflow: hidden;
        background: #06111e;
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      }

      .poster {
        position: relative;
        width: 720px;
        height: 760px;
        overflow: hidden;
        color: #fff7e7;
        background:
          radial-gradient(circle at 82% 12%, rgba(231, 189, 104, 0.22), transparent 250px),
          linear-gradient(180deg, #071426 0%, #071221 58%, #050b13 100%);
      }

      .source {
        position: absolute;
        inset: 0 0 auto;
        width: 100%;
        height: 78%;
        object-fit: cover;
        object-position: top center;
      }

      .poster::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(5, 12, 22, 0.08) 0%, rgba(5, 12, 22, 0.08) 36%, rgba(5, 12, 22, 0.96) 64%, #050b13 100%),
          linear-gradient(90deg, rgba(5, 12, 22, 0.16), rgba(5, 12, 22, 0.02) 60%, rgba(5, 12, 22, 0.1));
        z-index: 1;
      }

      .poster::after {
        content: "";
        position: absolute;
        inset: 20px;
        z-index: 3;
        pointer-events: none;
        border: 1px solid rgba(237, 204, 132, 0.36);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .content {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 30px 42px 28px;
      }

      .top-space {
        height: 506px;
      }

      .info {
        margin-top: 0;
        display: grid;
        gap: 14px;
      }

      .headline-strip {
        padding: 18px 20px;
        background: rgba(5, 12, 22, 0.78);
        border-left: 6px solid #e5bd68;
      }

      .headline-strip b {
        display: block;
        color: #e8c778;
        font-size: 34px;
        line-height: 1.15;
      }

      .headline-strip span {
        display: block;
        margin-top: 8px;
        color: rgba(255, 247, 231, 0.9);
        font-size: 20px;
        font-weight: 800;
      }

    </style>
  </head>
  <body>
    <div class="poster">
      <img class="source" src="img/poster-main.jpeg" alt="" aria-hidden="true" />
      <div class="content">
        <div class="top-space"></div>

        <div class="info">
          <div class="headline-strip">
            <b>AI商业模式 · 企业增长实战营</b>
            <span>3天2夜沉浸式学习，重构企业未来增长底层系统</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
